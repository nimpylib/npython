name: test C & JS
on:
  push:
    branches-ignore:
      - 'feat-*'
    paths:
      - '**/*.nim'
      - './*.nimble'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
env:
  nim-version: '2.2.8'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache nimble
      id: cache-nimble
      uses: actions/cache@v4
      with:
        path: ~/.nimble
        key: ${{ runner.os }}-nimble-v2
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ env.nim-version }}

    - name: BuildC
      run: nimble build --warning[Spacing]:off
    - name: Test C backend
      run: nimble test

    - name: BuildJs
      run: nimble buildJs -d:nodejs --warning[Spacing]:off
    - name: Test NodeJS backend
      run: nimble testNodeJs

    - name: BuildJsLib
      run: nimble buildJsLib --warning[Spacing]:off
    - name: Test es6 backend
      run: nimble testJsLib

    - name: setup wasi sdk
      uses: konsumer/install-wasi-sdk@v1
    - name: BuildWasm
      run: |
        nimble install https://github.com/nimpylib/wasm_backend
        nimble buildWasm --warning[Spacing]:off
